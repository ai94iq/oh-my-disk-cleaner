[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-cleaner"
version = "2.0.0-dev"
description = "Cross-platform disk space monitoring, analysis, and cleaning toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Disk Cleaner Contributors"},
]
keywords = ["disk", "cleaner", "storage", "cross-platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-benchmark>=5.3.0",
    "black>=26.10.1",
    "isort>=9.0.2",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
]
# Desktop apps: pip install -e ".[qt]" or -e ".[toga]" (editable, they need the skills/ tree)
qt = ["PySide6-Essentials>=6.12.0"]
toga = ["toga>=0.5.7"]

# The skill folder holds the only copy of the package; apps/ holds the desktop apps.
[tool.setuptools.packages.find]
where = ["skills/disk-cleaner", "apps"]
include = ["diskcleaner*"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313', 'py314', 'py315']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
# The package lives under skills/disk-cleaner, not at the repo root
known_first_party = ["diskcleaner"]
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "benchmark: performance benchmarks (needs pytest-benchmark)",
]

[tool.coverage.run]
source = ["diskcleaner"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
