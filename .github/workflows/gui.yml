# Desktop app: tests offscreen (Qt) on every push, bundles built
# and self-checked on every run, and a gui-vX.Y.Z tag (equal to apps/diskcleaner_gui __version__)
# attaches them to a GitHub release. The gui- prefix keeps these tags apart from the skill's.
name: Desktop apps

on:
  push:
    branches: [ main, feature/* ]
    tags: [ 'gui-v*.*.*' ]
  pull_request:
    branches: [ main, feature/* ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -q -U pip && python -m pip install -q -e ".[dev,qt]"
        shell: bash
      - run: python -m pytest -q tests/test_gui_service.py tests/test_gui_qt.py
        shell: bash

  qt-bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -q -U pip && python -m pip install -q -e ".[qt]"
        shell: bash
      - run: python packaging/qt/build_bundle.py bundles
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-${{ matrix.os }}
          path: bundles/DiskCleaner-*

  release:
    if: startsWith(github.ref, 'refs/tags/gui-v')
    needs: [test, qt-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach files to the GitHub release, this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag must equal the code's version, or the release holds mislabelled files.
      - run: |
          version=$(python3 -c 'import ast; t=open("apps/diskcleaner_gui/__init__.py").read(); print([n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", "") == "__version__"][0])')
          test "gui-v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: 'qt-*'
          merge-multiple: true
          path: bundles
      - run: cd bundles && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: bundles/*
